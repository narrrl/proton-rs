name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Secret Service backend of proton-auth-rs links libdbus.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
  # The keyring backend and the atomic writer have a code path per OS; build
  # and test them on each.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p proton-auth-rs -p proton-base-rs -p proton-media-rs --all-targets --features proton-auth-rs/keyring,proton-auth-rs/session,proton-base-rs/json,proton-media-rs/image --locked -- -D warnings
      - run: cargo test -p proton-auth-rs -p proton-base-rs -p proton-media-rs --features proton-auth-rs/keyring,proton-auth-rs/session,proton-base-rs/json,proton-media-rs/image --locked
