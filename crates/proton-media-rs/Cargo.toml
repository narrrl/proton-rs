[package]
name = "proton-media-rs"
description = "Media plumbing for Proton Drive apps: block range maps, single-flight fetches, crash-safe byte-budgeted disk caches for blocks and pictures, thumbnail rendering"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["proton", "cache", "streaming", "single-flight"]
categories = ["caching", "multimedia"]
readme = "README.md"

[features]
## Decode, orient, shrink and encode pictures (`render`).
image = ["dep:image"]
## `RevisionBlocks`: a Proton Drive revision as a stream's `BlockSource`.
drive = ["dep:proton-sdk", "dep:proton-drive-rs"]

[dependencies]
async-trait.workspace = true
futures = "0.3"
proton-drive-rs = { workspace = true, optional = true }
proton-sdk = { workspace = true, optional = true }
image = { version = "0.25.6", optional = true, default-features = false, features = ["jpeg", "png", "webp"] }
lru = "0.18"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
