[package]
name = "proton-rs"
description = "Shared building blocks for Proton Drive apps (credential storage, SQLite migrations, media caches, gallery core, Drive adapters), re-exported behind features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = []
auth = ["dep:proton-auth-rs"]
auth-session = ["auth", "proton-auth-rs/session"]
auth-keyring = ["auth", "proton-auth-rs/keyring"]
base = ["dep:proton-base-rs"]
base-json = ["base", "proton-base-rs/json"]
media = ["dep:proton-media-rs"]
media-image = ["media", "proton-media-rs/image"]
media-drive = ["media", "proton-media-rs/drive"]
gallery = ["dep:proton-gallery-rs"]
gallery-drive = ["gallery", "dep:proton-gallery-drive-rs"]
gallery-app = ["gallery-drive", "dep:proton-gallery-app-rs"]

[dependencies]
proton-auth-rs = { workspace = true, optional = true }
proton-base-rs = { workspace = true, optional = true }
proton-media-rs = { workspace = true, optional = true }
proton-gallery-rs = { workspace = true, optional = true }
proton-gallery-drive-rs = { workspace = true, optional = true }
proton-gallery-app-rs = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
